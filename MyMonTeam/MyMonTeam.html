<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMonTeam</title>
    <link rel="stylesheet" href="MyMonTeam.css">
</head>

<body>
    <div class="page">
        <header>
            <div class="brand">
                <div class="pokeball" aria-hidden="true"></div>
                <div>
                    <h1>MyMonTeam</h1>
                    <p class="subtitle">Build a six-Pokémon squad and calculate the matchup.</p>
                </div>
            </div>
            <div class="game-select">
                <label for="game">Game</label>
                <select id="game-select" name="game-select">
                    <option value="generation-i" selected>red-blue</option>
                    <option value="generation-i">yellow</option>
                    <option value="generation-ii">gold-silver</option>
                    <option value="generation-ii">crystal</option>
                    <option value="generation-iii">ruby-sapphire</option>
                    <option value="generation-iii">emerald</option>
                    <option value="generation-iii">firered-leafgreen</option>
                    <option value="generation-iv">diamond-pearl</option>
                    <option value="generation-iv">platinum</option>
                    <option value="generation-iv">heartgold-soulsilver</option>
                    <option value="generation-v">black-white</option>
                    <option value="generation-vi">x-y</option>
                    <option value="generation-vi">omega-ruby-alpha-sapphire</option>
                </select>
            </div>
        </header>

        <section class="search">
            <label for="pokemon-search">Search Pokémon</label>
            <input id="pokemon-search" type="search" name="pokemon-search" placeholder="Search Pokémon"
                autocomplete="off" autocorrect="off" spellcheck="false">
            <div id="search-results"></div>
        </section>

        <main class="team-grid" id="team">

        </main>

        <div class="actions">
            <button class="calculate" type="button">Calculate</button>
        </div>
    </div>

    <script src="MyMonTeam.js"></script>
</body>

</html>
